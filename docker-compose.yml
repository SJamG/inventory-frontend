# Paste this stack into Dockge.
# Note: nginx:alpine does not honour PUID/PGID (that's a linuxserver.io
# convention) - included here only for consistency with the rest of the
# homelab's compose files; it is a no-op for this image.
services:
  inventory-frontend:
    image: ghcr.io/sjamg/inventory-frontend:latest
    container_name: inventory-frontend
    restart: unless-stopped
    ports:
      - "8083:80"
    environment:
      - PUID=568
      - PGID=568
      - TZ=Europe/London
      # Auto-configures every device that loads the page - no per-device
      # Settings entry needed. NOCODB_TOKEN is a secret: set it here in
      # Dockge's own environment editor, never commit a real value to git.
      - NOCODB_URL=https://db.sjamg.me
      - NOCODB_TOKEN=REPLACE_WITH_YOUR_NOCODB_API_TOKEN
      - NOCODB_BOXES_ID=mpd5wmakym5yo04
      - NOCODB_ITEMS_ID=m83hhqlfdzbozyj
      - NOCODB_LINK_FIELD=Box
