server {
    listen       80;
    server_name  localhost;

    # This whole app is one HTML file plus a tiny generated config.js, both
    # of which can change on every deploy. Without explicit no-cache headers,
    # iOS Safari (especially when a page is opened via the Camera app's QR
    # scanner) can aggressively cache index.html and keep serving a stale
    # version indefinitely, with no per-site way to clear it from Settings.
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
